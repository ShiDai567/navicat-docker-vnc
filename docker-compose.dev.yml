# 开发环境：本地构建镜像
services:
  navicat:
    build: .
    image: navicat-dev
    container_name: navicat-dev
    ports:
      - 5800:5800 # Web GUI
      - 5900:5900 # VNC
    volumes:
      - ./data:/root
    environment:
      - TZ=Asia/Shanghai
      - HOME=/root
      - USER_ID=0
      - GROUP_ID=0
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - KEEP_APP_RUNNING=1
    restart: unless-stopped
